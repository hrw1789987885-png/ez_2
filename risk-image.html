<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风险详情</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      overflow: hidden;
      background: #06111f;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }
    .risk-screen {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #06111f;
    }
    .risk-screen img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      right: 24px;
      z-index: 2;
      height: 38px;
      padding: 0 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      color: #eaf8ff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(30, 108, 210, .96), rgba(20, 190, 245, .9));
      border: 1px solid rgba(152, 226, 255, .64);
      box-shadow: 0 0 18px rgba(20, 169, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .32);
    }
    .back-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="risk-screen">
    <img id="riskImage" src="assets/risk-water-leak.png" alt="风险详情界面">
    <a class="back-btn" href="index.html">返回界面</a>
  </main>

  <script>
    const riskPages = {
      water: { title: "供排水管网泄漏风险", img: "assets/risk-water-leak.png" },
      crowd: { title: "大客流风险", img: "assets/risk-crowd.png" },
      "building-fire": { title: "建筑火灾风险", img: "assets/risk-building-fire.png" },
      chemical: { title: "危化品生产经营安全风险", img: "assets/risk-chemical.png" },
      "tailings-dam": { title: "尾矿库溃坝风险", img: "assets/risk-tailings-dam.png" },
      flood: { title: "城市洪涝、内涝风险", img: "assets/risk-flood.png" },
      "forest-fire": { title: "森林火灾风险", img: "assets/risk-forest-fire.png" },
      drowning: { title: "防溺水", img: "assets/risk-drowning.png" },
      "straw-burning": { title: "秸秆焚烧", img: "assets/risk-straw-burning.png" }
    };

    const query = new URLSearchParams(window.location.search);
    const page = riskPages[query.get("risk")] || riskPages.water;
    const image = document.getElementById("riskImage");
    document.title = page.title;
    image.src = page.img;
    image.alt = `${page.title}详情界面`;
  </script>
</body>
</html>
