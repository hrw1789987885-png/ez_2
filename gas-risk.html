<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燃气管线泄漏爆炸风险</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      overflow: hidden;
      background: #081524;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }
    .risk-screen {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #081524;
    }
    .risk-screen img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      right: 24px;
      z-index: 2;
      height: 38px;
      padding: 0 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      color: #eaf8ff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(30, 108, 210, .96), rgba(20, 190, 245, .9));
      border: 1px solid rgba(152, 226, 255, .64);
      box-shadow: 0 0 18px rgba(20, 169, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .32);
    }
    .back-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="risk-screen">
    <img src="assets/gas-risk-screen.png" alt="燃气管线泄漏爆炸风险详情界面">
    <a class="back-btn" href="index.html">返回界面</a>
  </main>
</body>
</html>
